name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.14.3"

      - name: Build
        id: build
        run: |
          set -o pipefail
          gradle :app:assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish result to the builds branch
        if: always()
        run: |
          mkdir -p /tmp/out
          cp build.log /tmp/out/build.log || true
          cp app/build/outputs/apk/release/app-release.apk /tmp/out/ember.apk 2>/dev/null || true
          echo "commit=${{ github.sha }} run=${{ github.run_number }} result=${{ steps.build.outcome }}" > /tmp/out/status.txt
          git config user.name "ember-build"
          git config user.email "ember-build@users.noreply.github.com"
          git checkout --orphan builds
          git rm -rf . -q
          cp /tmp/out/* .
          git add -A
          git commit -q -m "Build ${{ github.run_number }}: ${{ steps.build.outcome }}"
          git push -f origin builds

      - name: Attach APK to a release
        if: steps.build.outcome == 'success'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Ember build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
